<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="#00d4ff" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#00d4ff" stroke-width="2" stroke-opacity="0.2"/>
  <!-- Globe/web lines -->
  <ellipse cx="128" cy="128" rx="60" ry="85" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <ellipse cx="128" cy="128" rx="30" ry="85" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="43" y1="128" x2="213" y2="128" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="58" y1="88" x2="198" y2="88" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="58" y1="168" x2="198" y2="168" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Blade shape - diagonal slash -->
  <path d="M 80 200 Q 100 140 128 128 Q 156 116 210 60"
        stroke="url(#blade)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Blade edge highlight -->
  <path d="M 85 195 Q 105 138 130 126 Q 155 114 205 65"
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Glow effect on blade -->
  <path d="M 80 200 Q 100 140 128 128 Q 156 116 210 60"
        stroke="#00d4ff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.15"/>
  <!-- Small accent dots -->
  <circle cx="128" cy="128" r="4" fill="#00d4ff"/>
  <circle cx="210" cy="60" r="3" fill="#ffffff" opacity="0.8"/>
</svg>