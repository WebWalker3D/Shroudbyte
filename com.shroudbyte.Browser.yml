app-id: com.shroudbyte.Browser
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: shroudbyte
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --env=QTWEBENGINE_DISABLE_SANDBOX=1

modules:
  - name: shroudbyte
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps .
    sources:
      - type: dir
        path: .
