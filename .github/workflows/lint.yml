name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade ruff

      - name: Ruff check
        run: ruff check browser tests
        # Format-check is intentionally not run yet — the codebase has
        # not been auto-formatted, so enabling it would force a one-time
        # mass rewrite. Add `ruff format --check` here once that's done.
