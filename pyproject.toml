[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shroudbyte"
version = "1.0.0"
description = "A privacy-focused web browser built on QtWebEngine"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11"
authors = [
    {name = "WebWalker3D", email = "binarycomputersolutions@gmail.com"},
]
keywords = ["browser", "privacy", "qtwebengine", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "PyQt6>=6.5.0",
    "PyQt6-WebEngine>=6.5.0",
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.4.0",
]

[project.scripts]
shroudbyte = "browser.__main__:main"

[project.gui-scripts]
shroudbyte-gui = "browser.__main__:main"

[tool.setuptools.packages.find]
include = ["browser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# A conservative starter set — pyflakes + pycodestyle errors + bug-prone
# patterns. Style nits beyond this are left to humans / future config.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # flake8-bugbear (real bug patterns)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern syntax)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",   # line too long — UI strings and HTML run long on purpose
    "E731",   # lambda assignments — used in a few Qt signal hookups
    "B008",   # function call as default arg — clear in context
    "UP038",  # isinstance tuple → union — incompatible with 3.11 type-check perf
]

[tool.ruff.lint.per-file-ignores]
# Scheme module is a giant template engine; F541 (no placeholders in f-string)
# fires constantly on intentional f-string usage for the CSS/JS embedding.
"browser/scheme.py" = ["F541", "E741"]
# Tests are allowed to have unused locals (assert side effects) and assertions.
"tests/*" = ["B011", "F401"]
